name: training-dev

services:
  api:
    build: ./api
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./config/scoring.json:/config/scoring.json:ro
    environment:
      - PORT=3001
      - DATA_DIR=/data
      - API_PASSWORD=${API_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - SCORING_CONFIG_PATH=/config/scoring.json
      - GARMIN_API_KEY=${GARMIN_API_KEY}
      - GARMIN_BASE_URL=${GARMIN_BASE_URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pwa:
    build: ./pwa
    restart: unless-stopped
    ports:
      - "8888:80"
    depends_on:
      api:
        condition: service_healthy

  training-mcp:
    build: ./mcp
    restart: unless-stopped
    environment:
      - PORT=3002
      - MCP_API_KEY=${MCP_API_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - API_INTERNAL_URL=http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, pas localhost : le serveur FastMCP écoute en IPv4 (0.0.0.0)
      # et Alpine résout localhost en ::1 en premier — wget échoue sans fallback.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

