# Limite les tentatives de login par IP en amont de l'API (qui a aussi son
# propre blocage après 5 échecs, voir api/src/lib/loginLimiter.ts).
limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Force runtime DNS resolution via Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        set $api_backend http://api:3001;
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Key "";
    }

    location /api/ {
        set $api_backend http://api:3001;
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Internal-Key est réservé aux appels serveur-à-serveur du MCP, qui
        # joint l'API directement sur le réseau Docker (api:3001), jamais via
        # nginx : on le supprime pour qu'un client externe ne puisse ni le
        # deviner ni l'utiliser.
        proxy_set_header X-Internal-Key "";
    }

    location /mcp/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_backend http://training-mcp:3002;
        # The mcp server (fastmcp) exposes a single Streamable HTTP endpoint
        # at /mcp regardless of the suffix the client uses externally (the
        # Claude connector is configured with .../mcp/sse) — always forward
        # to that one real path instead of passing the suffix through.
        rewrite ^/mcp/.*$ /mcp break;
        proxy_pass $mcp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }

    # The MCP server only supports API-key auth (no OAuth). Without these,
    # requests fall through to the SPA and return 200 + index.html, which
    # tricks OAuth-probing MCP clients into attempting (and failing) a full
    # OAuth handshake instead of using the configured API key.
    location /register {
        return 404;
    }

    location /.well-known/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
